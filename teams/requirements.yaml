name: requirements
model: opus # requirements sessions involve interactive reasoning and structured analysis
description: "Requirements gathering and analysis — structured planning before implementation"
default_mode: interactive
deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    agents: []
    objective: skills/global/housekeeping-objective.md
  - id: interactive
    label: Interactive
    phone_visible: false
    mode_type: interactive
  - id: ideas
    label: Ideas Triage
    phone_visible: true
    mode_type: work
  - id: review
    label: Review
    phone_visible: false
    mode_type: work
    agents: [reviewer]
    objective: skills/requirements/review-objective.md
    skills:
      - skills/requirements/review-code-quality.md
      - skills/requirements/review-security.md
      - skills/requirements/review-ops.md
      - skills/requirements/review-ui-uat.md
  - id: spike
    label: Spike Research
    phone_visible: true
    mode_type: work
    agents: [researcher]
    objective: skills/requirements/spike-objective.md
context:
  organization: sinh-x
  notes: "Solo agent (team manager does the work directly). Always run with --interactive."
agents:
  - name: analyst
    role: "Gather requirements through structured conversation, explore codebase, produce a plan covering the standard checklist"
    skill: skills/requirements/analyze.md
  - name: reviewer
    role: "Review existing system against structured checklist, produce severity-rated findings report"
    skill: skills/requirements/review.md
  - name: researcher
    role: "Autonomous spike researcher — run non-interactive research on a topic, explore the codebase and web, produce a spike report or full requirements doc"
    skill: skills/requirements/spike.md
# Objective is passed at deploy time, e.g.:
#   ./deploy.sh requirements --interactive
# Then tell it what you want to plan.
objective: |
  You are running as a solo requirements analyst — do NOT spawn sub-agents.

  When you pick up an inbox item for multi-step work, move it to
  `agent-teams/requirements/ongoing/` BEFORE starting. Move to `done/` when complete.

  Wait for the user to describe what they want to build or change.
  Then follow the analyze.md skill phases (1-6) to gather requirements interactively.

  Save the final requirements document to your workspace.
