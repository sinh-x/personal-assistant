name: rpm-gather
model: haiku  # scheduled data collection; read-only scan with keyword matching
description: RPM weekly gather — runs automatically on schedule to collect weekly RPM data
default_mode: background

deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    agents: []
    objective: skills/global/housekeeping-objective.md
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: background
    label: Background
    phone_visible: false
    mode_type: work

context:
  organization: sinh-x
  notes: "Solo agent, background only. Schedule via: pa schedule rpm-gather weekly --at 21:00"

variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant
  rpm_blocks: ~/Documents/ai-usage/agent-teams/rpm/rpm-blocks.yaml

agents:
  - name: gatherer
    role: "Collect weekly avo time, daily summaries, and MAP item progress — write to RPM inbox"
    skill: skills/rpm/weekly-gather.md

# This team is designed for background/scheduled use only.
# Schedule: pa schedule rpm-gather weekly --at 21:00
# Trigger manually: pa deploy rpm-gather --background
    skills:
      - name: pa-session-log
        inject-as: shared-skill
objective: |
  You are running as a solo RPM gather agent — do NOT spawn sub-agents.
  You are in background mode. Do NOT ask Sinh any questions.

  Follow skills/rpm/weekly-gather.md to:
  1. Read rpm-blocks.yaml (if missing, write minimal report and exit)
  2. Run avo week to get this week's time data
  3. Map avo time to RPM life areas
  4. Read daily summaries from this week
  5. Estimate MAP item progress via keyword matching in avo worklogs
  6. Write gather report to ~/Documents/ai-usage/agent-teams/rpm/inbox/YYYY-MM-DD-weekly-gather.md
  7. Create FYI ticket: `pa ticket create --type fyi --assignee sinh --priority low --estimate XS --title "FYI: RPM weekly gather complete YYYY-MM-DD" --summary "<brief summary of gather results>"`

  When done, write the completion marker and exit.
