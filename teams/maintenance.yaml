name: maintenance
model: sonnet # diagnosis and fixes require reasoning; issues may be subtle
description: "Investigate, diagnose, and fix issues in the personal-assistant system"
default_mode: background
deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    provider: minimax
    agents: []
    objective: skills/global/housekeeping-objective.md
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: background
    label: Background
    phone_visible: true
    mode_type: work
    provider: minimax
    solo: true
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: foreground
    label: Foreground
    phone_visible: true
    mode_type: work
    provider: minimax
    solo: true
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: interactive
    label: Interactive
    phone_visible: false
    mode_type: interactive
    provider: minimax
    solo: true
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: repo-scan
    label: Repo Scan
    phone_visible: true
    mode_type: work
    provider: minimax
    solo: true
    objective: skills/maintenance/repo-scan-objective.md
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: repo-health
    label: Repo Health
    phone_visible: true
    mode_type: work
    provider: minimax
    solo: true
    objective: skills/maintenance/repo-health-objective.md
    skills:
      - name: pa-session-log
        inject-as: shared-skill
context:
  organization: sinh-x
  notes: "Solo agent. Deploy with --objective for specific issues, or plain for health check."
variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant
agents:
  - name: mechanic
    role: "Investigate issues, apply fixes, run health checks on the personal-assistant system"
    skill: skills/maintenance.md
objective: |
  You are a SOLO operator — do ALL work yourself, do NOT spawn sub-agents.

  Working directory: /home/sinh/git-repos/sinh-x/tools/personal-assistant

  When you pick up an inbox item for multi-step work, move it to
  `agent-teams/maintenance/ongoing/` BEFORE starting. Move to `done/` when complete.

  You are the maintenance agent for the personal-assistant system. Your job is to
  keep the system healthy and fix problems.

  If additional instructions are provided below, focus on that specific issue.
  Otherwise, run a full health check:
  1. Syntax-check all scripts (bash -n)
  2. Verify systemd timers are active
  3. Check registry for stuck/dead deployments
  4. Check folder structure exists (report only — sprint-master owns this, do NOT create folders)
  5. Review recent self-improvement suggestions from daily summaries and agent sessions
  6. Apply any safe, clear fixes
  7. Produce a health check report

  IMPORTANT: If you encounter something you don't understand or can't fix safely,
  STOP and report your findings. Do not guess or make risky changes.

  After fixing anything, verify with dry-run or syntax check before finishing.
  Add a completion comment on the working ticket: `pa ticket comment <id> --author mechanic --content "Health check complete: <summary>. Session log: sessions/YYYY/MM/agent-team/<filename>.md"`
  If no working ticket, create an FYI ticket: `pa ticket create --type fyi --assignee sinh --priority low --estimate XS --title "FYI: Maintenance run <date>" --summary "<summary of what was done>"`
