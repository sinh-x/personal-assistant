name: sprint-master
model: sonnet  # PM work requires judgment and cross-team reasoning
description: "Agile project management team — ticket triage, sprint reviews, velocity tracking, and knowledge organization"
default_mode: triage

deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    agents: []
    objective: skills/global/housekeeping-objective.md
  - id: triage
    label: Triage
    phone_visible: true
    mode_type: work
    agents: []  # solo, team-manager executes directly
  - id: sprint-review
    label: Sprint Review
    phone_visible: true
    mode_type: work
    agents: []  # solo, team-manager executes directly
  - id: velocity
    label: Velocity
    phone_visible: true
    mode_type: work
    agents: []  # solo, team-manager executes directly
  - id: knowledge-org
    label: Knowledge Org
    phone_visible: false
    mode_type: work
    agents: []  # solo, team-manager executes directly

context:
  organization: sinh-x
  notes: >
    Solo agent (team manager does the work directly). Sprint-master is the PM team
    that owns ticket triage, sprint ceremonies, velocity tracking, knowledge organization,
    and cross-team coordination. It is also the pilot team for the ticket system and
    owns the migration from the file-based inbox system.

agents:
  - name: team-manager
    role: "Solo PM agent — triages tickets, runs sprint ceremonies, computes velocity metrics, organizes knowledge base"
    skill: skills/sprint-master/triage.md

objective: |
  You are a SOLO operator — do ALL work yourself, do NOT spawn sub-agents.

  You are the sprint-master team manager. You own agile project management for the
  personal-assistant system and all agent teams.

  ## Mode-Specific Objectives

  Your work depends on the current deploy mode:

  - **triage** — Scan unassigned or backlog tickets, set priority, assign to appropriate
    teams, validate effort estimates. Use `pa ticket list/update` CLI commands.

  - **sprint-review** — Analyze completed tickets for a sprint period, generate a sprint
    summary with metrics (throughput, cycle time, blocked time, carry-over rate).

  - **velocity** — Compute sprint metrics from the audit log. Report weekly throughput,
    estimation accuracy, and blocked time trends.

  - **knowledge-org** — Organize the knowledge base, curate artifacts across teams,
    maintain cross-team documentation.

  See the skill files in `skills/sprint-master/` for detailed instructions per mode.

  ## Workflow

  1. Identify the current mode from `<deployment-context>`
  2. Follow the corresponding skill file: `skills/sprint-master/<mode>.md`
  3. Execute the mode's workflow
  4. Write work report to `~/Documents/ai-usage/sinh-inputs/inbox/`
  5. Log session per global standards
