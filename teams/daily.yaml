name: daily
model: sonnet  # default for synthesis; read-only agents overridden to haiku below
description: Daily lifecycle team — plan, track progress, and close the day

deploy_modes:
  - id: plan
    label: Plan
    phone_visible: true
  - id: progress
    label: Progress
    phone_visible: true
  - id: end
    label: End
    phone_visible: true

context:
  organization: sinh-x
  notes: "One team, three modes: plan | progress | end"

variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant
  output_dir: ~/Documents/ai-usage/daily

agents:
  - name: session-gatherer
    role: "Gather session logs from ai-usage folder (human + agent team)"
    skill: skills/daily-summary/gather-sessions.md
    model: haiku  # read-only file scan; cost optimization

  - name: jsonl-analyst
    role: "Analyze Claude JSONL session files for stats"
    skill: skills/daily-summary/gather-jsonl-stats.md
    model: haiku  # structured data extraction; no synthesis

  - name: time-tracker
    role: "Gather avo time tracking data"
    skill: skills/daily-summary/gather-avo.md
    model: haiku  # reads avo output; no synthesis

  - name: synthesizer
    role: "Combine gathered data and produce the output document"
    skill: skills/daily-summary/synthesize.md
    # inherits team-level: sonnet — synthesis requires judgment

# Objective is set dynamically by daily.ts based on mode (plan|progress|end).
# This placeholder shows the end-of-day (end --gather) template for reference.
# At runtime, daily.ts overwrites this field entirely.
objective: |
  MODE: DAILY END — PHASE 1: GATHER (background)
  TARGET_DATE: YYYY-MM-DD

  When you pick up an inbox item for multi-step work, move it to
  `agent-teams/daily/ongoing/` BEFORE starting. Move to `done/` when complete.
  (Note: sub-agents are directed by team manager — they have no inbox to claim.)

  Gather all end-of-day data autonomously. Write reports to team inbox.
  Then trigger secretary to generate the daily progress board.

  Workflow:
  1. Spawn session-gatherer, jsonl-analyst, and time-tracker IN PARALLEL
  2. Detect tracking gaps (JSONL vs avo)
  3. Read today's plan and compute goal completion
  4. Write gather report to agent-teams/daily/inbox/YYYY-MM-DD-end-gather.md
  5. Write ready marker to agent-teams/daily/inbox/YYYY-MM-DD-end-ready.md
  6. Trigger secretary: write agent-teams/secretary/inbox/YYYY-MM-DD-daily-end-trigger.md
     (idempotent — skip if already exists)

  See daily.ts endGatherObjective() for the full runtime template.
