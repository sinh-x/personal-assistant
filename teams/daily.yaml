name: daily
description: Daily lifecycle team — plan, track progress, and close the day

context:
  organization: sinh-x
  notes: "One team, three modes: plan | progress | end"

variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant
  output_dir: ~/Documents/ai-usage/daily

agents:
  - name: session-gatherer
    role: "Gather session logs from ai-usage folder (human + agent team)"
    skill: skills/daily-summary/gather-sessions.md

  - name: jsonl-analyst
    role: "Analyze Claude JSONL session files for stats"
    skill: skills/daily-summary/gather-jsonl-stats.md

  - name: time-tracker
    role: "Gather avo time tracking data"
    skill: skills/daily-summary/gather-avo.md

  - name: synthesizer
    role: "Combine gathered data and produce the output document"
    skill: skills/daily-summary/synthesize.md

# Objective is set dynamically by daily.sh based on mode (plan|progress|end)
objective: |
  MODE: DAILY PLAN (morning)
  TARGET_DATE: 2026-03-11
  
  Create the daily plan for 2026-03-11.
  
  Workflow:
  1. Spawn session-gatherer and time-tracker IN PARALLEL (skip jsonl-analyst — not needed for planning)
     - session-gatherer: read YESTERDAY's sessions + open todos carried forward
     - time-tracker: get avo task list, yesterday's plan vs actual
  2. Once both are done, spawn synthesizer with their data and this instruction:
     - Read yesterday's daily summary from /home/sinh/Documents/ai-usage/daily/2026/03/ if it exists
     - Extract yesterday's 'Tomorrow's Priorities' as today's starting goals
     - Extract all open/carried-forward todos
     - Get current avo task list
     - Produce a daily plan document
  
  Output: /home/sinh/Documents/ai-usage/daily/2026/03/2026-03-11-plan.md
  
  Plan document structure:
    ## Today's Goals (from yesterday's priorities + new items)
    | # | Goal | Source | Priority |
    ## Time Budget
    | Category | Planned | Notes |
    ## Open Items Carried Forward
    - [ ] item (from session/date)
    ## Today's Task List
    (from avo task list, prioritized)
  
