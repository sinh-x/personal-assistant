name: daily
model: sonnet  # default for synthesis; read-only agents overridden to haiku below
description: Daily lifecycle team — plan, track progress, and close the day

hierarchy:
  team-manager:
    role: "Orchestrate daily lifecycle — plan, progress, end"
    participates_in: all
  agents:
    - name: session-gatherer
      participates_in: [progress, end]
    - name: jsonl-analyst
      participates_in: [progress, end]
    - name: time-tracker
      participates_in: [progress, end]
    - name: synthesizer
      participates_in: [progress, end-review]

deploy_modes:
  - id: plan
    label: Plan
    phone_visible: true
    agents: []  # solo, no sub-agents
  - id: plan-review
    label: Plan Review
    phone_visible: false
    agents: []  # solo, no sub-agents
  - id: progress
    label: Progress
    phone_visible: true
  - id: end
    label: End
    phone_visible: true
  - id: end-review
    label: End Review
    phone_visible: false
    agents: []  # TM spawns synthesizer interactively after Sinh confirms

context:
  organization: sinh-x
  notes: "One team, three modes: plan | progress | end"

variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant
  output_dir: ~/Documents/ai-usage/daily

agents:
  - name: session-gatherer
    role: "Gather session logs from ai-usage folder (human + agent team)"
    skill: skills/daily-summary/gather-sessions.md
    model: haiku  # read-only file scan; cost optimization

  - name: jsonl-analyst
    role: "Analyze Claude JSONL session files for stats"
    skill: skills/daily-summary/gather-jsonl-stats.md
    model: haiku  # structured data extraction; no synthesis

  - name: time-tracker
    role: "Gather avo time tracking data"
    skill: skills/daily-summary/gather-avo.md
    model: haiku  # reads avo output; no synthesis

  - name: synthesizer
    role: "Combine gathered data and produce the output document"
    skill: skills/daily-summary/synthesize.md
    # inherits team-level: sonnet — synthesis requires judgment

# Objectives are defined in teams/daily/modes/<mode-id>.md and substituted
# at runtime by daily.ts (dynamic variables: TODAY, OUTPUT_DIR, etc.).
# Modes: plan, plan-review, progress, end, end-review
# This field serves as fallback if mode files are not found.
objective: |
  See teams/daily/modes/ for mode-specific objectives.
  Run with: pa daily plan | pa daily plan --review | pa daily progress | pa daily end | pa daily end --review
