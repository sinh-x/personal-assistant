name: secretary
deprecated: true
deprecated_by: sprint-master
deprecated_reason: "Inbox audit absorbed into sprint-master triage; route-decisions replaced by ticket system"
model: sonnet  # orchestration, auditing, and interactive coordination require judgment
description: "[DEPRECATED] Intake auditing & organization — collects evidence, audits inboxes, and acts as a conversational workflow coordinator in --interactive mode"

hierarchy:
  team-manager:
    role: "Orchestrate evidence collection, inbox auditing, and conversational workflow coordination"
    participates_in: all
  agents:
    - name: collector
      participates_in: [interactive, background, foreground]
    - name: auditor
      participates_in: [interactive, background, foreground]

default_mode: direct

deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    agents: []
    objective: skills/global/housekeeping-objective.md
  - id: background
    label: Background
    phone_visible: true
    mode_type: work
    objective: teams/secretary/modes/background.md
  - id: foreground
    label: Foreground
    phone_visible: true
    mode_type: work
    objective: teams/secretary/modes/foreground.md
  - id: interactive
    label: Interactive
    phone_visible: false
    mode_type: interactive
    objective: teams/secretary/modes/interactive.md
  - id: direct
    label: Direct
    phone_visible: true
    mode_type: work
    objective: teams/secretary/modes/direct.md
    agents: []

context:
  organization: sinh-x
  notes: "Multi-agent team. In --interactive mode: Phase 0 preloads workflow knowledge, Phase 3 is a lightweight startup briefing (direct inbox scan + daily board if available), Phase 4 is a natural-language conversational loop (route/approve/reject/defer/archive/create-task/team-message). In non-interactive mode: collector + auditor pipeline with auto-archive of DONE items. Best run with --interactive for day-to-day workflow coordination."

variables:
  ai_usage_root: ~/Documents/ai-usage
  git_repos_root: /home/sinh/git-repos

agents:
  - name: collector
    role: "Scan git repos, deployment registry, session logs, done folders, and artifacts for recent work evidence"
    skill: skills/secretary/collect.md
    model: haiku  # structured scanning; no synthesis needed

  - name: auditor
    role: "Cross-reference inbox items against collected evidence, classify each as DONE/OBSOLETE/STALE/ACTIVE/NEEDS-ACTION"
    skill: skills/secretary/audit.md
    # inherits team-level: sonnet — cross-referencing and classification require judgment

objective: |
  Fallback — no mode specified. Use --mode <id> to select a mode. Available modes: background, foreground, interactive, direct.
