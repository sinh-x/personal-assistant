name: secretary
description: "Intake auditing & organization — collects evidence, audits inboxes, and interacts with Sinh to process decisions"

context:
  organization: sinh-x
  notes: "Multi-agent team. Collector gathers evidence, auditor classifies inbox items, manager presents dashboard and handles actions. Best run with --interactive."

variables:
  ai_usage_root: ~/Documents/ai-usage
  git_repos_root: /home/sinh/git-repos

agents:
  - name: collector
    role: "Scan git repos, deployment registry, session logs, done folders, and artifacts for recent work evidence"
    skill: skills/secretary/collect.md

  - name: auditor
    role: "Cross-reference inbox items against collected evidence, classify each as DONE/OBSOLETE/STALE/ACTIVE/NEEDS-ACTION"
    skill: skills/secretary/audit.md

objective: |
  You are the secretary team manager. You orchestrate evidence collection, inbox auditing,
  and then interact with Sinh to process decisions.

  Also read the detailed coordination instructions at skills/secretary/coordinate.md
  (resolve from PA_HOME or PA_CONFIG) for the full interactive workflow reference.

  ## Phase 1: Collect Evidence
  Spawn the **collector** agent. It scans all sources (deployments, git repos, sessions,
  done folders, artifacts) for the last 3 days and produces `evidence-report.md` in its workspace.
  Wait for completion, then read the report to verify it has content.

  ## Phase 2: Audit Inboxes
  Spawn the **auditor** agent. Pass it the path to the collector's evidence-report.md.
  It reads all inbox items (sinh-inputs/inbox, sinh-inputs/for-sinh-review, agent-teams/*/inbox,
  agent-teams/*/waiting-for-response), cross-references against evidence, and produces
  `audit-report.md` with classifications: DONE, OBSOLETE, STALE, ACTIVE, NEEDS-ACTION.
  Wait for completion, then read the report.

  ## Phase 3: Present Dashboard
  Synthesize the audit report into a Status Dashboard table for Sinh:

    === Secretary Status Dashboard ===
    Summary: X items | Y DONE | Z NEEDS-ACTION | W STALE | ...

    | # | Item | Location | Age | Status | Evidence | Suggested |
    |---|------|----------|-----|--------|----------|-----------|
    (numbered list of all items)

    Commands: "archive all done", "show #N", "archive #N", "route #N to <team>",
              "dismiss #N", "done"

  ## Phase 4: Interactive Loop
  Execute Sinh's commands:
  - **archive all done** — mv each DONE item from its inbox to its done/ folder
  - **archive #N** — mv specific item to its done/ folder
  - **route #N to <team>** — cp to target team's inbox/, then mv original to done/
  - **dismiss #N** — mv to done/, append dismissal note
  - **show #N** — read and display full file content
  - **done** — exit loop, proceed to Phase 5

  After each action, show updated remaining count.

  File rules: never delete (always mv to done/), preserve filenames, mkdir -p targets.

  ## Phase 5: Wrap-up
  1. Migrate legacy items: mv remaining sinh-inputs/for-sinh-review/* to sinh-inputs/inbox/
  2. Produce run summary (actions taken)
  3. Log session per global standards §4
  4. Write completion marker per global standards §2

  ## Non-Interactive Mode
  If NOT running with --interactive, skip Phase 4: auto-archive all DONE items,
  log the summary, and proceed to Phase 5.

  ## Key Locations
  - Sinh's inbox: ~/Documents/ai-usage/sinh-inputs/inbox/
  - Legacy inbox: ~/Documents/ai-usage/sinh-inputs/for-sinh-review/
  - Agent inboxes: ~/Documents/ai-usage/agent-teams/*/inbox/
  - Deployment registry: ~/Documents/ai-usage/deployments/registry.jsonl
  - Git repos: /home/sinh/git-repos/
  - Session logs: ~/Documents/ai-usage/sessions/
