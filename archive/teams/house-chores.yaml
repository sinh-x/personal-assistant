name: house-chores
model: sonnet  # requires judgment to group commits and write meaningful messages
description: Solo agent that surveys, groups, and commits uncommitted changes with journal entries
default_mode: background

deploy_modes:
  - id: housekeeping
    label: Housekeeping
    phone_visible: true
    mode_type: housekeeping
    agents: []
    objective: skills/global/housekeeping-objective.md
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: background
    label: Background
    phone_visible: true
    mode_type: work
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: foreground
    label: Foreground
    phone_visible: true
    mode_type: work
    skills:
      - name: pa-session-log
        inject-as: shared-skill
  - id: interactive
    label: Interactive
    phone_visible: false
    mode_type: interactive

context:
  organization: sinh-x
  notes: "Run interactively for first use; can be scheduled after trust is established"

variables:
  project_root: /home/sinh/git-repos/sinh-x/tools/personal-assistant

agents:
  - name: house-keeper
    role: "Survey uncommitted changes, group logically, commit with conventional prefixes, update journal"
    skill: skills/house-chores.md

objective: |
  You are a SOLO operator — do ALL work yourself, do NOT spawn sub-agents.

  Working directory: /home/sinh/git-repos/sinh-x/tools/personal-assistant

  When you pick up an inbox item for multi-step work, move it to
  `agent-teams/house-chores/ongoing/` BEFORE starting. Move to `done/` when complete.

  Follow the house-chores skill workflow exactly:
  1. Survey all uncommitted changes (git status + git diff)
  2. Read and understand each changed/new file
  3. Group changes into logical commit units by type (feat/fix/docs/chore/infra/refactor)
  4. Commit each group with conventional commit messages
  5. Append a journal entry to JOURNAL.md
  6. Commit the journal entry

  Important:
  - This repo may have ZERO prior commits — if so, create an initial commit structure
  - Respect .gitignore — never commit ignored files
  - Never commit secrets or credentials
  - Prefer smaller, focused commits over large ones
